<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 120" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Hard Hat -->
  <path d="M 68 32 Q 80 20 92 32 Z" fill="#EAB308" stroke="#1C1917" stroke-width="2"/>
  <rect x="65" y="32" width="30" height="4" rx="2" fill="#EAB308" stroke="#1C1917"/>
  <!-- Head & Smile -->
  <circle cx="80" cy="42" r="8" fill="#F1F0EC" stroke="#1C1917"/>
  <!-- Eyes -->
  <circle cx="77" cy="41" r="1" fill="#1C1917"/>
  <circle cx="83" cy="41" r="1" fill="#1C1917"/>
  <path d="M 77 46 Q 80 48 83 46" stroke="#1C1917" fill="none"/>
  <!-- High-Vis Vest & Torso -->
  <path d="M 70 50 L 90 50 L 94 82 L 66 82 Z" fill="#EAB308" stroke="#1C1917" stroke-width="2"/>
  <rect x="74" y="52" width="12" height="30" fill="#FAF8F4" stroke="#78716C" stroke-width="1.5"/>
  <!-- Clipboard Arm (Left) -->
  <path d="M 70 54 L 56 68 L 62 72" stroke="#1C1917" stroke-width="3" fill="none"/>
  <!-- Clipboard -->
  <rect x="48" y="65" width="18" height="24" rx="2" fill="#D97706" stroke="#1C1917"/>
  <rect x="52" y="62" width="10" height="4" rx="1" fill="#1C1917"/>
  <line x1="52" y1="72" x2="62" y2="72" stroke="#FAF8F4" stroke-width="1.5"/>
  <line x1="52" y1="77" x2="62" y2="77" stroke="#FAF8F4" stroke-width="1.5"/>
  <line x1="52" y1="82" x2="59" y2="82" stroke="#FAF8F4" stroke-width="1.5"/>
  <!-- Waving Arm (Right) -->
  <g class="anim-worker-wave">
    <path d="M 90 54 L 105 45 L 115 32" stroke="#1C1917" stroke-width="3" fill="none"/>
    <circle cx="116" cy="30" r="3" fill="#F1F0EC" stroke="#1C1917"/>
  </g>
  <!-- Legs & Steel Toe Boots -->
  <line x1="74" y1="82" x2="74" y2="105" stroke="#1C1917" stroke-width="4"/>
  <line x1="86" y1="82" x2="86" y2="105" stroke="#1C1917" stroke-width="4"/>
  <rect x="68" y="103" width="10" height="6" rx="2" fill="#292524" stroke="#1C1917"/>
  <rect x="84" y="103" width="10" height="6" rx="2" fill="#292524" stroke="#1C1917"/>
</svg>
