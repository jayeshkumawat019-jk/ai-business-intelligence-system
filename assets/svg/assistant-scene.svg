<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 120" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Small Jib Crane -->
  <line x1="40" y1="110" x2="40" y2="25" stroke="#1C1917" stroke-width="4"/>
  <line x1="30" y1="25" x2="260" y2="25" stroke="#EAB308" stroke-width="3"/>
  <polygon points="40,25 40,12 80,25" fill="#EAB308"/>
  <rect x="25" y="108" width="30" height="8" rx="2" fill="#1C1917"/>
  
  <!-- Hoist and Thinking / Landed Block -->
  <g id="assistant-hoist-group" class="anim-assistant-hoist thinking">
    <line x1="170" y1="25" x2="170" y2="55" stroke="#57534E" stroke-width="1.5"/>
    <rect x="162" y="55" width="16" height="4" rx="1" fill="#1C1917"/>
    <!-- Intelligence Data Block -->
    <rect x="150" y="59" width="40" height="26" rx="3" fill="#2563EB" stroke="#1C1917" stroke-width="2"/>
    <path d="M 160 72 L 167 78 L 180 66" stroke="#FAF8F4" stroke-width="2.5" fill="none"/>
  </g>

  <!-- Friendly Worker Standing Nearby Guiding the Load -->
  <g transform="translate(225, 45)">
    <!-- Helmet -->
    <path d="M 10 18 Q 18 10 26 18 Z" fill="#EAB308" stroke="#1C1917"/>
    <rect x="8" y="18" width="20" height="3" fill="#EAB308"/>
    <circle cx="18" cy="24" r="5" fill="#FAF8F4" stroke="#1C1917"/>
    <!-- Vest -->
    <rect x="12" y="29" width="12" height="18" fill="#EAB308" stroke="#1C1917"/>
    <!-- Waving Hand -->
    <g class="anim-worker-wave">
      <path d="M 24 31 L 34 22 L 38 15" stroke="#1C1917" stroke-width="2" fill="none"/>
      <circle cx="39" cy="14" r="2" fill="#FAF8F4"/>
    </g>
    <!-- Legs -->
    <line x1="15" y1="47" x2="15" y2="62" stroke="#1C1917" stroke-width="2.5"/>
    <line x1="21" y1="47" x2="21" y2="62" stroke="#1C1917" stroke-width="2.5"/>
  </g>

  <!-- Concrete Dock Surface -->
  <line x1="10" y1="110" x2="310" y2="110" stroke="#1C1917" stroke-width="2"/>
  <line x1="20" y1="114" x2="300" y2="114" stroke="#D5D1C8" stroke-dasharray="6 4"/>
</svg>
