<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 100" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Caterpillar Tracks -->
  <rect x="20" y="70" width="75" height="18" rx="8" fill="#292524" stroke="#1C1917" stroke-width="2"/>
  <circle cx="30" cy="79" r="5" fill="#EFE8DC" stroke="#1C1917"/>
  <circle cx="48" cy="79" r="5" fill="#EFE8DC" stroke="#1C1917"/>
  <circle cx="67" cy="79" r="5" fill="#EFE8DC" stroke="#1C1917"/>
  <circle cx="85" cy="79" r="5" fill="#EFE8DC" stroke="#1C1917"/>
  <!-- Cab & Engine Body -->
  <path d="M 28 70 L 28 50 L 55 50 L 72 60 L 75 70 Z" fill="#EAB308" stroke="#1C1917" stroke-width="2"/>
  <!-- Cabin Glass -->
  <path d="M 52 52 L 68 62 L 52 62 Z" fill="#DBEAFE" stroke="#1C1917"/>
  <!-- Excavator Boom & Arm -->
  <g class="anim-jcb-boom">
    <line x1="32" y1="52" x2="65" y2="25" stroke="#EAB308" stroke-width="6"/>
    <circle cx="65" cy="25" r="4" fill="#1C1917"/>
    <line x1="65" y1="25" x2="110" y2="45" stroke="#EAB308" stroke-width="5"/>
    <!-- Bucket -->
    <g class="anim-jcb-bucket">
      <path d="M 110 45 Q 125 45 130 65 L 115 72 Q 105 55 110 45 Z" fill="#1C1917" stroke="#1C1917"/>
      <!-- Teeth -->
      <polygon points="130,65 133,68 128,70" fill="#EAB308"/>
    </g>
  </g>
  <!-- Mounded Earth / Dig Site -->
  <path d="M 125 88 Q 145 75 175 88 L 220 88" fill="none" stroke="#B45309" stroke-width="2" stroke-dasharray="2 3"/>
  <!-- Ground Line -->
  <line x1="5" y1="88" x2="235" y2="88" stroke="#D5D1C8"/>
</svg>
