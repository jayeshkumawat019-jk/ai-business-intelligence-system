<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 90" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <!-- Forklift Body -->
  <path d="M 40 68 L 40 45 L 75 45 L 90 55 L 90 68 Z" fill="#EAB308" stroke="#1C1917" stroke-width="2"/>
  <rect x="42" y="32" width="28" height="13" rx="2" fill="#1C1917"/>
  <!-- Roll Cage -->
  <line x1="50" y1="45" x2="50" y2="25" stroke="#1C1917" stroke-width="3"/>
  <line x1="72" y1="45" x2="72" y2="25" stroke="#1C1917" stroke-width="3"/>
  <line x1="48" y1="25" x2="75" y2="25" stroke="#1C1917" stroke-width="3"/>
  <!-- Mast -->
  <line x1="110" y1="70" x2="110" y2="15" stroke="#1C1917" stroke-width="4"/>
  <line x1="115" y1="70" x2="115" y2="15" stroke="#78716C" stroke-width="2"/>
  <!-- Tines & Pallet (Animated) -->
  <g class="anim-forklift-tines">
    <path d="M 108 55 L 140 55 L 140 50" stroke="#1C1917" stroke-width="3" fill="none"/>
    <!-- Wooden Pallet -->
    <rect x="114" y="46" width="36" height="5" fill="#D97706" stroke="#1C1917"/>
    <!-- Cardboard Low Stock Boxes -->
    <rect x="116" y="24" width="20" height="22" rx="1" fill="#FEF3C7" stroke="#B45309" stroke-width="1.5"/>
    <line x1="116" y1="35" x2="136" y2="35" stroke="#D97706"/>
    <rect x="130" y="30" width="18" height="16" rx="1" fill="#FEE2E2" stroke="#DC2626" stroke-width="1.5"/>
  </g>
  <!-- Forklift Wheels -->
  <circle cx="55" cy="72" r="9" fill="#292524" stroke="#1C1917" stroke-width="2"/>
  <circle cx="55" cy="72" r="3" fill="#EFE8DC"/>
  <circle cx="102" cy="72" r="7" fill="#292524" stroke="#1C1917" stroke-width="2"/>
  <circle cx="102" cy="72" r="2.5" fill="#EFE8DC"/>
  <!-- Ground -->
  <line x1="15" y1="81" x2="205" y2="81" stroke="#D5D1C8" stroke-dasharray="4 4"/>
</svg>
