<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 100" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
  <g class="anim-cargo-ship">
    <!-- Ship Hull -->
    <path d="M 30 55 L 60 80 L 220 80 L 255 55 Z" fill="#1C1917" stroke="#1C1917" stroke-width="2"/>
    <line x1="38" y1="62" x2="248" y2="62" stroke="#DC2626" stroke-width="3"/>
    <!-- Bridge / Superstructure -->
    <rect x="200" y="25" width="30" height="30" rx="1" fill="#FAF8F4" stroke="#1C1917" stroke-width="2"/>
    <line x1="205" y1="33" x2="225" y2="33" stroke="#2563EB" stroke-width="2"/>
    <!-- Radar Mast & Funnel -->
    <line x1="215" y1="25" x2="215" y2="15" stroke="#1C1917" stroke-width="2"/>
    <rect x="188" y="28" width="8" height="15" fill="#EAB308" stroke="#1C1917"/>
    <!-- Stacked Shipping Containers on Deck -->
    <!-- Layer 1 -->
    <rect x="65" y="42" width="35" height="13" rx="1" fill="#2563EB" stroke="#1C1917"/>
    <rect x="105" y="42" width="35" height="13" rx="1" fill="#EA580C" stroke="#1C1917"/>
    <rect x="145" y="42" width="35" height="13" rx="1" fill="#059669" stroke="#1C1917"/>
    <!-- Layer 2 -->
    <rect x="70" y="29" width="35" height="13" rx="1" fill="#D97706" stroke="#1C1917"/>
    <rect x="110" y="29" width="35" height="13" rx="1" fill="#2563EB" stroke="#1C1917"/>
    <rect x="150" y="29" width="35" height="13" rx="1" fill="#7C3AED" stroke="#1C1917"/>
  </g>
  <!-- Animated Ocean Waves -->
  <g class="anim-ocean-wave">
    <path d="M 5 82 Q 25 76 45 82 T 85 82 T 125 82 T 165 82 T 205 82 T 245 82 T 285 82" stroke="#2563EB" stroke-width="2.5" fill="none"/>
    <path d="M -15 88 Q 5 82 25 88 T 65 88 T 105 88 T 145 88 T 185 88 T 225 88 T 265 88" stroke="#93C5FD" stroke-width="2" fill="none"/>
  </g>
</svg>
